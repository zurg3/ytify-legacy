name: Build and Deploy
env:
  NODE_VERSION: "24"

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: error-reporting/ytify-legacy
          ref: 86280cab72f8ef3c149259758f22741e502069fc

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Patch
        run: wget https://raw.githubusercontent.com/zurg3/ytify-legacy/master/patch/start.ts -O src/modules/start.ts

      - name: Build
        env:
          VITE_BASE_PATH: "/ytify-legacy/"
        run: |
          npm install
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
